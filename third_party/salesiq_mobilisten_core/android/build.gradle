group 'com.zoho.salesiq.mobilisten.core.plugin'
version '1.0'

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://maven.zohodl.com' }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace "com.zoho.salesiq.mobilisten.core.plugin"
    compileSdk 34

    defaultConfig {
        minSdkVersion 21
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.zoho.salesiq:mobilisten-core:0.0.4'
}
